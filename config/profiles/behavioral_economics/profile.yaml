profile_id: behavioral_economics
display_name: 行为经济学
display_name_en: Behavioral Economics
description: 真实决策行为——偏好、信念、注意力与有限理性的经济学后果与政策含义。
status: active
screening_prompt_version: 2026-09-24-behavioral-v2
screening_timeout_seconds: 150
screening_dimensions:
  centrality_label: 行为机制中心性
  centrality_definition: 'a behavioural mechanism is the core research object: preferences (risk, time,
    social, ambiguity, reference dependence), beliefs and expectations (updating, over/under-confidence,
    mental models), attention and cognition limits (salience, complexity, inattention), judgement heuristics
    and biases, self-control, or social preferences (trust, reciprocity, fairness, norms) — as the thing
    being explained, measured or targeted, not as a side remark.'
  economics_definition: 'the paper carries substantive economic content: markets, incentives, welfare,
    policy, contracts or mechanism design, an economic outcome driven by the behavioural mechanism, or
    credible identification of a behavioural parameter.'
subject_signals:
  jel_codes:
  - D90
  - D91
  - D03
  - D83
  - D84
  - C90
  - C91
  - C92
  - C93
  - G40
  - G41
  - I12
  - O12
  topics:
  - risk and time preferences
  - belief updating and expectations
  - overconfidence and projection bias
  - attention, salience and inattention
  - defaults, framing and nudges
  - social preferences, trust and reciprocity
  - incentive crowding out and motivation
  - limited rationality in markets and firms
  - field and laboratory experiments on economic choice
