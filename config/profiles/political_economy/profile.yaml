profile_id: political_economy
display_name: 政治经济学
display_name_en: Political Economy
description: 政治机制如何决定经济政策与经济结果——权力、制度、集体选择与分配冲突。
status: active
screening_prompt_version: 2026-09-25-political-economy-v1
screening_timeout_seconds: 150
screening_dimensions:
  centrality_label: 政治机制中心性
  centrality_definition: 'the paper''s explanatory mechanism is political: an identifiable political actor
    (voters, legislators, parties, coalitions, autocrats, bureaucrats, interest groups, unions, firms
    seeking influence, foreign governments) chooses, and that choice causes the economic outcome or the
    economic policy being studied.  The paper must be able to answer "who decides, under what constraints,
    and why" — not merely "policy changed".'
  economics_definition: 'the paper studies an economic outcome or instrument with welfare content: taxes,
    transfers, spending, regulation, trade policy, public goods, rents, growth, inequality, employment
    or prices — and reaches it through a political mechanism rather than treating policy as an exogenous
    shock.'
