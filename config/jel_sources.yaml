version: "2026-09-25-v1"

# What counts as a JEL code
# -------------------------
# JEL classification is published by the *source*: the American Economic Review
# section letters (A..Z), one or two digits, and an optional letter suffix.
# Codes are only ever copied from a source that published them for that exact
# paper.  No model, no title heuristic, no completion of a partial code.
#
# Measured fact behind this file: the usual bibliographic APIs do not carry JEL
# codes for these journals.  Crossref exposes no JEL field, OpenAlex has none,
# and Semantic Scholar has none — only publisher metadata and RePEc do.

# JEL codes the enrichment pass is allowed to look for.  This is the union of
# the codes the profiles declare a research interest in, so the harvest stays
# small and every request is explainable.  It is a union, not a per-profile
# list: JEL codes are a paper fact and are shared by all profiles.
