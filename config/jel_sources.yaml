# RePEc (IDEAS) carries the publisher-supplied JEL classification for records
# it indexes, and it is the only open source that does so at any scale.
#
# RePEc's own guidance (https://ideas.repec.org/getdata.html) discourages
# scraping: it puts load on volunteer-run servers and is a poor way to get
# complete data.  Their API is issued by request (https://ideas.repec.org/api.html).
#
# The provider below therefore ships **disabled**.  When it is enabled it:
#   * fetches only the per-JEL-code classification listings, one request per
#     page — never one request per paper;
#   * caches every response on disk with a TTL, so re-runs make no new requests;
#   * waits `extra_delay_seconds` on top of `rate_limit_per_second`;
#   * identifies itself with a contact address;
#   * gives up on a page rather than retrying hard when the server pushes back.
#
# To use a different source instead, implement the `JelProvider` protocol in
# services/jel_enrichment.py and register it in `build_providers`; nothing else
# in the product needs to change.
repec_ideas:
  enabled: false
  rate_limit_per_second: 0.2
  extra_delay_seconds: 1.0
  timeout_seconds: 30.0
  # One page per code.  IDEAS paginates its listings with a server-side query
  # string we may not construct, and guessing URLs would silently shrink the
  # index; a single page is fetched per code and nothing is invented.
  max_pages_per_code: 1
  index_ttl_seconds: 86400
  user_agent: "EduEconRadar/0.5 (personal literature review; JEL metadata; contact: local-operator)"
