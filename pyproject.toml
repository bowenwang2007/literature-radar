[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eduecon-radar"
version = "0.5.0"
description = "A personal literature radar for economics and social science research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "streamlit==1.59.2",
  # This Streamlit release uses the Starlette gzip responder API from 1.3.1.
  "starlette==1.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
eduecon-radar = "eduecon_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eduecon_radar"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "eduecon_radar/resources/migrations"
"prompts" = "eduecon_radar/resources/prompts"
"manifests" = "eduecon_radar/resources/manifests"
"journals.yaml" = "eduecon_radar/resources/journals.yaml"
"config/public_papers.json" = "eduecon_radar/resources/config/public_papers.json"
"config/abstract_sources.yaml" = "eduecon_radar/resources/config/abstract_sources.yaml"
"config/repec_series.json" = "eduecon_radar/resources/config/repec_series.json"
"config/journals/catalog.json" = "eduecon_radar/resources/config/journals/catalog.json"
